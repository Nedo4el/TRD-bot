# Запуск любого бота 24/7:
#   docker compose up -d --build robot-flat
#   docker compose up -d --build              # все сразу
# Логи: docker compose logs -f robot-yrovni-d
services:
  robot-flat:
    build:
      context: .
      args:
        BOT_NAME: robot_flat
    container_name: trd-robot-flat
    restart: unless-stopped
    env_file:
      - robot_flat/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  robot-yrovni-d:
    build:
      context: .
      args:
        BOT_NAME: robot_yrovni_D
    container_name: trd-robot-yrovni-d
    restart: unless-stopped
    env_file:
      - robot_yrovni_D/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  robot-trend:
    build:
      context: .
      args:
        BOT_NAME: robot_trend
    container_name: trd-robot-trend
    restart: unless-stopped
    env_file:
      - robot_trend/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  robot-impulse:
    build:
      context: .
      args:
        BOT_NAME: robot_impulse
    container_name: trd-robot-impulse
    restart: unless-stopped
    env_file:
      - robot_impulse/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  robot-krugloe:
    build:
      context: .
      args:
        BOT_NAME: robot_krugloe
    container_name: trd-robot-krugloe
    restart: unless-stopped
    env_file:
      - robot_krugloe/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
