# Запуск любого бота 24/7:
#   docker compose up -d --build bot-flat
#   docker compose up -d --build              # все сразу
# Логи: docker compose logs -f bot-yrovni
services:
  bot-flat:
    build:
      context: .
      args:
        BOT_NAME: bot_flat
    container_name: trd-bot-flat
    restart: unless-stopped
    env_file:
      - bot_flat/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  bot-yrovni:
    build:
      context: .
      args:
        BOT_NAME: bot_yrovni
    container_name: trd-bot-yrovni
    restart: unless-stopped
    env_file:
      - bot_yrovni/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  bot-trend:
    build:
      context: .
      args:
        BOT_NAME: bot_trend
    container_name: trd-bot-trend
    restart: unless-stopped
    env_file:
      - bot_trend/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  bot-impulse:
    build:
      context: .
      args:
        BOT_NAME: bot_impulse
    container_name: trd-bot-impulse
    restart: unless-stopped
    env_file:
      - bot_impulse/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  bot-0:
    build:
      context: .
      args:
        BOT_NAME: bot_0
    container_name: trd-bot-0
    restart: unless-stopped
    env_file:
      - bot_0/.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
